<div class="auth-page">
  <div class="auth-card login-card">
    <div class="row g-0 align-items-center">
      <div class="col-lg-6 d-none d-lg-flex illustration-side">
        <div class="illustration-box">
          <div class="money-icon">$</div>
          <p>Track your spending and manage your money smarter</p>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="form-side">
          <div class="brand mb-4">
            <div class="brand-icon">$</div>
            <h4>ExpenseFlow</h4>
          </div>

          <h2>Welcome back</h2>
          <p class="subtitle">Track your spending and manage your money smarter</p>

          <div *ngIf="errorMessage" class="alert alert-danger py-2">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                placeholder="name@company.com"
                formControlName="email"
              />
              <small class="text-danger" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                Valid email is required
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                placeholder="••••••••"
                formControlName="password"
              />
              <small class="text-danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                Password is required
              </small>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>

              <a href="#" class="small-link">Forgot password?</a>
            </div>

            <button class="btn btn-primary w-100 auth-btn" type="submit" [disabled]="isLoading">
              {{ isLoading ? 'Logging in...' : 'LOGIN' }}
              <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </form>

          <div class="divider">
            <span>Or continue with</span>
          </div>

          <div class="row g-3">
            <div class="col-6">
              <button class="btn social-btn w-100" disabled>
                <i class="bi bi-google me-2"></i>
                Google
              </button>
            </div>
            <div class="col-6">
              <button class="btn social-btn w-100" disabled>
                <i class="bi bi-bank me-2"></i>
                SSO
              </button>
            </div>
          </div>

          <p class="auth-switch">
            Don't have an account?
            <a routerLink="/auth/register">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
